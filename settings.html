<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cuenta · Ainmo</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#111318;--muted:#666c78;--line:#d9dce1;--paper:#fafaf8;--soft:#f1f2ef;--blue:#1b48d4;--green:#176b43;--amber:#8a5300;--red:#8a2020}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 'Inter Tight',system-ui,sans-serif}a{color:inherit}nav{height:64px;background:var(--ink);color:#fff;display:flex;align-items:center}.nav-inner{width:min(1040px,calc(100% - 32px));margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{font-size:23px;font-weight:800;text-decoration:none;letter-spacing:-.05em}.nav-links{display:flex;gap:18px;font-size:13px}.nav-links a{text-decoration:none;color:#d9dce1}.wrap{width:min(900px,calc(100% - 32px));margin:0 auto;padding:58px 0 90px}.eyebrow{font:500 11px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}h1{font-size:42px;line-height:1.08;letter-spacing:-.04em;margin:10px 0 36px}h2{font-size:20px;margin:0}.panel{border:1px solid var(--line);background:#fff;margin-bottom:18px}.panel-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.panel-body{padding:22px}.muted{color:var(--muted);font-size:13px}.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:10px;border:1px solid var(--line);font:inherit}.field input[disabled]{background:var(--soft);color:var(--muted)}.actions{display:flex;gap:8px;align-items:center;margin-top:18px}.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:9px 14px;font:600 13px inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:#fff;color:var(--ink);border-color:var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.usage-line{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.meter{height:7px;background:var(--soft);overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,#ff9b4b,#e3bf57,#69b98c,#5aa6cd,#7f77d9);width:0}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.plan{border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;min-height:245px}.plan.current{border:2px solid var(--ink)}.plan-name{font-size:18px;font-weight:700}.plan-price{font-size:25px;font-weight:800;margin:10px 0 3px}.plan ul{padding-left:18px;color:var(--muted);font-size:13px;flex:1}.plan li{margin:7px 0}.plan .btn{width:100%;margin-top:12px}.notice{padding:12px 14px;margin-bottom:18px;border-left:4px solid var(--green);background:#e8f4ed;color:#174d33}.notice.error{border-color:var(--red);background:#fbeaea;color:var(--red)}.loading{padding:40px;text-align:center;color:var(--muted)}.signed-out{padding:55px 24px;text-align:center}.signed-out h2{font-size:27px;margin-bottom:8px}.status{font:500 11px 'JetBrains Mono',monospace;text-transform:uppercase;padding:5px 8px;background:var(--soft)}@media(max-width:720px){.wrap{padding-top:34px}h1{font-size:34px}.plans,.account-grid{grid-template-columns:1fr}.nav-links a:first-child{display:none}}
</style>
</head>
<body>
<nav><div class="nav-inner"><a class="brand" href="/">ainmo</a><div class="nav-links"><a href="/app">Consultar lote</a><a href="/dashboard">Portafolio</a></div></div></nav>
<main class="wrap">
  <div class="eyebrow">Cuenta</div>
  <h1>Configuración de la cuenta</h1>
  <div id="notice"></div>
  <div id="content" class="panel"><div class="loading">Cargando su cuenta…</div></div>
</main>
<script>
let client=null,session=null,profile=null,config=null;
const money=value=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(value||0);
const authHeaders=()=>session?.access_token?{Authorization:`Bearer ${session.access_token}`}:{ };
function notice(message,error=false){document.getElementById('notice').innerHTML=message?`<div class="notice${error?' error':''}">${message}</div>`:''}
function esc(value){return String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json',...authHeaders(),...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||`HTTP ${response.status}`);return data}
function signedOut(){document.getElementById('content').innerHTML=`<div class="signed-out"><h2>Inicie sesión para ver su cuenta</h2><p class="muted">La consulta de lotes sigue disponible sin cuenta.</p><div class="actions" style="justify-content:center"><a class="btn" href="/app?login=1&next=/settings">Iniciar sesión</a><a class="btn secondary" href="/app">Volver a la herramienta</a></div></div>`}
function render(){
  if(!profile)return signedOut();
  const plan=profile.plan||'free',used=Number(profile.usage_this_month||0),limit=Number(profile.usage_limit||0);
  const pct=limit?Math.min(100,used/limit*100):100;
  const plans=config?.subscription_plans||{};
  const planCard=(key,name,features)=>{const p=plans[key]||{};const current=plan===key;const price=key==='free'?'$0':p.price_cop_month?`${money(p.price_cop_month)}<small style="font-size:12px;font-weight:500">/mes</small>`:(p.available?'Ver precio en Stripe':'Por definir');return `<article class="plan${current?' current':''}"><div class="plan-name">${name}</div><div class="plan-price">${price}</div><ul>${features.map(x=>`<li>${x}</li>`).join('')}</ul>${current?'<span class="status">Plan actual</span>':key==='free'?'':`<button class="btn" onclick="checkout('${key}')" ${!p.available?'disabled':''}>${p.available?'Elegir este plan':'Próximamente'}</button>`}</article>`};
  const period=profile.current_period_end?new Date(profile.current_period_end).toLocaleDateString('es-CO'):'';
  const accessSection=config?.open_beta?`<section class="panel"><div class="panel-head"><div><h2>Beta abierta</h2><div class="muted">No hay cobros ni límites de plan mientras validamos el producto.</div></div><span class="status">Acceso completo</span></div><div class="panel-body"><p style="margin:0">Incluye informes PDF, DXF, historial, enlaces compartidos y comparación de hasta 100 lotes sin costo durante la beta.</p></div></section>`:`<section class="panel"><div class="panel-head"><div><h2>Planes</h2><div class="muted">La consulta individual permanece abierta; los planes amplían guardado y flujo de equipos.</div></div>${profile.subscription_status?`<span class="status">${esc(profile.subscription_status)}${period?' · '+period:''}</span>`:''}</div><div class="panel-body"><div class="plans">${planCard('free','Gratis',['5 análisis guardados al mes','Comparación de hasta 5 lotes','Exportación individual disponible'])}${planCard('pro','Pro',['Análisis guardados ilimitados','Comparación de hasta 100 lotes','Portafolio, CSV y escenarios'])}${planCard('team','Equipos',['Todo Pro','Preparado para API y flujos internos','Facturación administrable'])}</div>${profile.has_billing_account?'<div class="actions"><button class="btn secondary" onclick="billingPortal()">Administrar suscripción en Stripe</button></div>':''}</div></section>`;
  document.getElementById('content').outerHTML=`<div id="content">
    <section class="panel"><div class="panel-head"><div><h2>Perfil</h2><div class="muted">La identidad usada para guardar y compartir análisis.</div></div><span class="status">${config?.open_beta?'Beta abierta':esc(plan)}</span></div><div class="panel-body"><div class="account-grid"><div class="field"><label>Nombre</label><input id="name" value="${esc(profile.name||'')}"></div><div class="field"><label>Correo</label><input value="${esc(profile.email||'')}" disabled></div></div><div class="actions"><button class="btn" onclick="saveProfile()">Guardar cambios</button><button class="btn secondary" onclick="logout()">Cerrar sesión</button></div></div></section>
    <section class="panel"><div class="panel-head"><div><h2>Uso y portafolio</h2><div class="muted">Los análisis anónimos no cuentan ni se guardan en la nube.</div></div><a class="btn secondary" href="/dashboard">Abrir portafolio</a></div><div class="panel-body"><div class="usage-line"><span>Análisis guardados este mes</span><strong>${limit?`${used} de ${limit}`:'Ilimitados'}</strong></div><div class="meter"><span style="width:${limit?pct:100}%"></span></div></div></section>
    ${accessSection}
  </div>`;
}
async function saveProfile(){try{const data=await api('/api/me',{method:'PATCH',body:JSON.stringify({name:document.getElementById('name').value})});profile.name=data.data?.name||document.getElementById('name').value;notice('Perfil actualizado.');render()}catch(error){notice(error.message,true)}}
async function checkout(plan){try{const data=await api('/api/billing/checkout',{method:'POST',body:JSON.stringify({plan})});location.href=data.url}catch(error){notice(error.message,true)}}
async function billingPortal(){try{const data=await api('/api/billing/portal',{method:'POST'});location.href=data.url}catch(error){notice(error.message,true)}}
async function logout(){if(client)await client.auth.signOut();location.href='/app'}
async function boot(){
  try{config=await fetch('/api/config').then(r=>r.json());if(!config.supabase_url||!config.supabase_anon_key||!window.supabase)return signedOut();client=window.supabase.createClient(config.supabase_url,config.supabase_anon_key);session=(await client.auth.getSession()).data.session;if(!session)return signedOut();profile=await api('/api/me');render();const params=new URLSearchParams(location.search);if(params.get('billing')==='success'){notice('Pago recibido. Stripe está actualizando su plan; si aún no cambia, recargue en unos segundos.');const id=params.get('session_id');if(id){try{await api(`/api/billing/status?session_id=${encodeURIComponent(id)}`);profile=await api('/api/me');render()}catch(_){}}}else if(params.get('billing')==='cancelled')notice('No se realizó ningún cobro.');}catch(error){notice(error.message,true);signedOut()}
}
boot();
</script>
</body>
</html>
