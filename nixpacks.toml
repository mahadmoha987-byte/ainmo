[phases.setup]
# WeasyPrint needs native Pango/GLib libraries in addition to the Python wheel.
# Extend Nixpacks' generated Python setup instead of replacing it.
aptPkgs = [
  "libpango-1.0-0",
  "libpangoft2-1.0-0",
  "libharfbuzz-subset0",
  "libgdk-pixbuf-2.0-0",
  "libffi-dev",
  "shared-mime-info",
  "fonts-dejavu-core",
]
