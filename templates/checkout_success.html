<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Su informe está listo | Ainmo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500;600&family=Overpass:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#252a2c;--muted:#66706a;--paper:#faf9f6;--pearl:linear-gradient(115deg,#f4e8df,#f5f0dc 26%,#e9efe3 48%,#e6edf2 73%,#ede7f2)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--pearl);color:var(--ink);font:300 17px/1.6 Overpass,sans-serif;padding:24px}.card{width:min(620px,100%);background:var(--paper);padding:52px;border:1px solid #dedfd9;box-shadow:0 24px 70px #24393418}.logo{font:600 30px Arial,sans-serif;letter-spacing:-2px;margin-bottom:48px}h1{font:500 48px/1.05 Dosis,sans-serif;margin:0 0 18px}.message{color:var(--muted)}.button{display:inline-flex;margin-top:24px;background:var(--ink);color:#fff;text-decoration:none;padding:15px 20px;font-weight:500;border:0;cursor:pointer}.button[aria-disabled=true]{opacity:.45;pointer-events:none}.error{color:#a33b32}.small{font-size:12px;color:#777;margin-top:20px}@media(max-width:520px){.card{padding:32px}h1{font-size:39px}}
  </style>
</head>
<body><main class="card"><div class="logo">ainmo</div><p>Pago de informe</p><h1 id="title">Confirmando su pago…</h1><p class="message" id="message">No cierre esta página. Estamos verificando el pago directamente con Stripe.</p><a class="button" id="download" aria-disabled="true" href="#">Preparando PDF…</a><p class="small">Guarde esta página si necesita volver a descargar el informe. El informe es una prefactibilidad y no sustituye una licencia ni un concepto oficial.</p></main>
<script>
  const sessionId = {{ session_id | tojson }};
  const title = document.getElementById('title');
  const message = document.getElementById('message');
  const download = document.getElementById('download');
  async function verify(){
    if(!sessionId){ title.textContent='No encontramos el pago'; message.textContent='Vuelva al informe e inicie el pago nuevamente.'; download.hidden=true; return; }
    try{
      const response=await fetch('/api/checkout/status?session_id='+encodeURIComponent(sessionId),{cache:'no-store'});
      const data=await response.json();
      if(!response.ok||!data.ok) throw new Error(data.message||'El pago aún no está confirmado.');
      title.textContent='Su informe está listo';
      message.textContent=(data.address||'Predio consultado')+' · Lote '+data.lotcodigo;
      download.textContent='Descargar informe PDF ↓';
      download.href='/api/report?checkout_session_id='+encodeURIComponent(sessionId);
      download.setAttribute('aria-disabled','false');
    }catch(error){ title.textContent='No pudimos confirmar el pago'; message.textContent=error.message; message.classList.add('error'); download.hidden=true; }
  }
  verify();
</script></body></html>
